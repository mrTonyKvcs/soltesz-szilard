name: soltesz-laravel13
services:
  app:
    build: docker/php
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8186
      DB_HOST: database
      DB_DATABASE: soltesz
      DB_USERNAME: soltesz
      DB_PASSWORD: local-soltesz
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      database:
        condition: service_healthy
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8186:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: soltesz
      MYSQL_USER: soltesz
      MYSQL_PASSWORD: local-soltesz
      MYSQL_ROOT_PASSWORD: local-root
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8029:8025"
volumes:
  database:
